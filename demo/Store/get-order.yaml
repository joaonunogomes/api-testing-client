meta:
  name: Get order by ID
  description: "GET /store/order/{orderId} — looks up the order saved in {{orderId}}."
  seq: 3
request:
  method: GET
  url: "{{baseUrl}}/store/order/{{orderId}}"
scripts:
  post-response: |
    const order = res.json();
    ac.test("status is 200", () => ac.expect(res.status).toBe(200));
    ac.test("id matches {{orderId}}", () => {
      ac.expect(String(order.id)).toBe(ac.getVar("orderId"));
    });
    console.log("Order status:", order.status, "| complete:", order.complete);
