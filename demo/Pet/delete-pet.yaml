meta:
  name: Delete a pet
  description: >-
    DELETE /pet/{petId} — removes the pet created earlier. Sends the api_key
    header explicitly (the value comes from the environment secret {{apiKey}}).
  seq: 5
request:
  method: DELETE
  url: "{{baseUrl}}/pet/{{petId}}"
  headers:
    api_key: "{{apiKey}}"
scripts:
  post-response: |
    ac.test("delete succeeded (200)", () => ac.expect(res.status).toBe(200));
    console.log("Deleted pet", ac.getVar("petId"));
