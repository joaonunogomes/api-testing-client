meta:
  name: Add a new pet
  description: POST /pet — creates a pet. A pre-request script picks a random name into {{petName}}; the post-response script saves the new id into {{petId}} so the "Get", "Update" and "Delete" requests can reuse it.
  seq: 1
request:
  method: POST
  url: "{{baseUrl}}/pet"
  headers:
    X-Request-Id: "{{runId}}"
  body:
    type: json
    content: |
      {
        "name": "{{petName}}",
        "category": { "id": 1, "name": "{{defaultCategory}}" },
        "photoUrls": ["https://placedog.net/500/500"],
        "tags": [{ "id": 10, "name": "demo" }],
        "status": "{{petStatus}}"
      }
scripts:
  pre-request: |
    // Give every created pet a unique, friendly name.
    const names = ["Rex", "Bella", "Milo", "Luna", "Charlie", "Daisy", "Cooper", "Lucy"];
    const name = names[Math.floor(Math.random() * names.length)] + "-" + Math.floor(Math.random() * 1000);
    ac.setVar("petName", name);
    console.log("Creating pet:", name);
  post-response: |
    const pet = res.json();

    ac.test("status is 200", () => ac.expect(res.status).toBe(200));
    ac.test("response has an id", () => ac.expect(pet && pet.id).toBeDefined());
    ac.test("name matches what we sent", () => {
      ac.expect(pet.name).toBe(ac.getVar("petName"));
    });

    if (pet && pet.id) {
      ac.setVar("petId", String(pet.id));
      console.log("Saved petId =", pet.id);
    }
