meta:
  name: Update user
  description: >-
    PUT /user/{username} — updates the account's phone number. Demonstrates
    HTTP Basic auth built from {{username}} and the {{password}} secret.
  seq: 4
request:
  method: PUT
  url: "{{baseUrl}}/user/{{username}}"
  auth:
    type: basic
    username: "{{username}}"
    password: "{{password}}"
  body:
    type: json
    content: |
      {
        "username": "{{username}}",
        "firstName": "Demo",
        "lastName": "User (updated)",
        "email": "{{generate 'email'}}",
        "phone": "{{generate 'phone'}}",
        "userStatus": 1
      }
scripts:
  post-response: |
    ac.test("status is 200", () => ac.expect(res.status).toBe(200));
    console.log("Updated user:", ac.getVar("username"));
